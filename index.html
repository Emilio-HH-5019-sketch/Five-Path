<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Path CUGDL - Transparencia Blockchain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="app">
        <!-- Navegación -->
        <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="shield-check"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Five Path <span class="text-indigo-600">CUGDL</span></span>
            </div>
            <div class="flex items-center gap-4 font-medium">
                <button onclick="navigateTo('home')" class="hover:text-indigo-600">Inicio</button>
                <button onclick="navigateTo('blockchain')" class="hover:text-indigo-600">Libro Abierto</button>
                <button onclick="navigateTo('donate')" class="bg-indigo-600 text-white px-5 py-2 rounded-full hover:bg-indigo-700 shadow-lg">Donar</button>
            </div>
        </nav>

        <main id="main-content" class="max-w-6xl mx-auto px-6 py-12">
            <!-- El contenido se genera dinámicamente -->
        </main>

        <footer class="mt-20 border-t border-slate-200 bg-white py-10 px-6 text-center">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">
                © <span id="current-year"></span> Proyecto Five Path - Centro Universitario de Guadalajara
            </p>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ================================================================
        // CONFIGURACIÓN PARA GITHUB (IMPORTANTE)
        // ================================================================
        // Si estás en GitHub, pega aquí tus credenciales de Firebase.
        // Si estás en el editor de IA, el código usará las variables automáticas.
        
        let firebaseConfig = {
            apiKey: "", // PEGA AQUÍ TU API KEY SI USAS GITHUB
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        // Fallback para el entorno de IA (No tocar)
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {}

        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'five-path-cugdl';

        // Inicialización segura
        let app, auth, db;
        let isConfigured = false;

        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "") {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            isConfigured = true;
        }

        let allDonations = [];
        let currentView = 'home';
        let user = null;

        // Autenticación
        if (isConfigured) {
            signInAnonymously(auth).catch(e => console.error("Error Auth:", e));
            onAuthStateChanged(auth, (u) => {
                user = u;
                if (u) listenDonations();
                render();
            });
        }

        function listenDonations() {
            if (!db) return;
            const path = `artifacts/${APP_ID}/public/data/donations`;
            onSnapshot(collection(db, path), (snap) => {
                allDonations = snap.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data(),
                    timestamp: doc.data().timestamp?.toDate() || new Date()
                })).sort((a, b) => b.timestamp - a.timestamp);
                render();
            }, (err) => {
                console.error("Error Firestore:", err);
            });
        }

        window.navigateTo = (v) => { currentView = v; render(); };

        window.handleDonate = async (e) => {
            e.preventDefault();
            if (!isConfigured) return alert("Configura Firebase primero.");
            
            const btn = e.target.querySelector('button');
            const amount = parseFloat(document.getElementById('don-amount').value);
            const name = document.getElementById('don-name').value || "Anónimo";

            btn.disabled = true;
            btn.innerText = "Registrando...";

            try {
                await addDoc(collection(db, `artifacts/${APP_ID}/public/data/donations`), {
                    amount,
                    user: name,
                    timestamp: serverTimestamp(),
                    hash: 'sha256-' + Math.random().toString(36).substring(2)
                });
                navigateTo('blockchain');
            } catch (err) {
                alert("Error de permisos. Revisa las reglas de Firestore.");
                btn.disabled = false;
                btn.innerText = "Reintentar";
            }
        };

        function render() {
            const main = document.getElementById('main-content');
            document.getElementById('current-year').innerText = new Date().getFullYear();

            if (!isConfigured) {
                main.innerHTML = `
                    <div class="bg-white p-10 rounded-[2rem] border-2 border-dashed border-slate-200 text-center space-y-4">
                        <i data-lucide="settings" class="mx-auto w-12 h-12 text-slate-300"></i>
                        <h2 class="text-xl font-bold">Falta Configuración</h2>
                        <p class="text-slate-500 text-sm">Para que esto funcione en GitHub, debes pegar tus credenciales de Firebase dentro del código fuente (línea 55).</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            if (currentView === 'home') {
                main.innerHTML = `
                    <div class="text-center space-y-8 animate-fade-in">
                        <h1 class="text-5xl font-black">Bienvenido a <span class="text-indigo-600">Five Path</span></h1>
                        <p class="text-slate-500 max-w-2xl mx-auto">La plataforma de transparencia del CUGDL. Cada donación es un bloque inmutable en nuestra red.</p>
                        <div class="flex justify-center gap-4">
                            <button onclick="navigateTo('donate')" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-200">Empezar a Ayudar</button>
                            <button onclick="navigateTo('blockchain')" class="bg-white border border-slate-200 px-8 py-4 rounded-2xl font-bold">Ver Libro Abierto</button>
                        </div>
                    </div>
                `;
            } else if (currentView === 'donate') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto bg-white p-8 rounded-[2.5rem] shadow-xl animate-fade-in">
                        <h2 class="text-2xl font-black mb-6 text-center">Nueva Donación</h2>
                        <form onsubmit="handleDonate(event)" class="space-y-4">
                            <input id="don-name" type="text" placeholder="Nombre (opcional)" class="w-full p-4 bg-slate-50 rounded-xl outline-none">
                            <input id="don-amount" type="number" required placeholder="Monto (MXN)" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold">
                            <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">Firmar Transacción</button>
                        </form>
                    </div>
                `;
            } else {
                main.innerHTML = `
                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-3xl font-black">Libro de Transacciones</h2>
                        ${allDonations.length === 0 ? '<p class="text-slate-400 italic">No hay registros aún...</p>' : 
                        allDonations.map(d => `
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 flex flex-wrap justify-between items-center gap-4">
                                <div>
                                    <p class="text-xs font-black text-indigo-400 uppercase">Donador</p>
                                    <p class="font-bold">${d.user}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-black text-green-400 uppercase">Cantidad</p>
                                    <p class="font-bold">$${d.amount}</p>
                                </div>
                                <div class="w-full md:w-auto">
                                    <p class="text-[10px] font-mono text-slate-400 break-all">${d.hash}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
